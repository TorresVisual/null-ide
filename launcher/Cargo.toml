[package]
name = "null-launcher"
version = "0.1.0"
edition = "2021"

[lib]
name = "null_launcher"
path = "src/lib.rs"

# Keeps this package out of the `setup/` workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
