[package]
name = "wooting-analog-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs: stable Node-API bindings — no electron-rebuild needed
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
# libloading: safe dynamic library loading — we load the Wooting DLL at runtime
# so the extension works even when no keyboard is plugged in
libloading = "0.8"

[build-dependencies]
napi-build = "2"

[profile.release]
# Produce a smaller .node file
lto = true
strip = true
opt-level = "z"
