        <g transform="matrix(3.23499,0,0,3.23499,-111.75,-111.75)">
            <circle class="lp-circle" cx="50" cy="50" r="27" style="fill:none;stroke:black;stroke-width:7px;"/>
        </g>
        <g transform="matrix(3.23499,0,0,3.23499,-111.75,-111.75)">
            <path class="lp-slash" d="M75,25L25,75" style="fill:none;fill-rule:nonzero;stroke:black;stroke-width:7px;"/>
        </g>
    </g>
