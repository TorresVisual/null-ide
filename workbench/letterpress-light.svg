<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="100%" height="100%" viewBox="0 0 260 260" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;">
    <defs>
        <style>
            @keyframes null-lp-circle { from { stroke-dashoffset: 170 } to { stroke-dashoffset: 0 } }
            @keyframes null-lp-slash  { from { stroke-dashoffset: 71  } to { stroke-dashoffset: 0 } }
            .lp-circle { stroke-dasharray: 170; stroke-dashoffset: 170; animation: null-lp-circle 1.8s ease-out forwards; }
