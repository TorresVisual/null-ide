[package]
name = "null-setup-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.30"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
