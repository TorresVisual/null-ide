name: Build Null IDE

on:
  workflow_dispatch:
    inputs:
      vscodium_tag:
        description: 'VSCodium tag to build against (overrides pinned VSCODIUM_TAG)'
        required: false
        default: ''
  push:
    tags: ['v*']
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC — upstream check only

concurrency:
  group: null-ide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: 'null'
  APP_NAME_LONG: Null IDE
  CSPELL_TAG: 'code-spell-checker-v4.5.6'   # Pinned release tag — update this to upgrade the spell checker

jobs:
  # ── Scheduled: open a PR when VSCodium releases a new version ──────────────
  upstream-check:
    name: Check for new VSCodium release
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Compare latest VSCodium tag to pinned tag
        run: |
          LATEST=$(curl -fsSL https://api.github.com/repos/VSCodium/vscodium/releases/latest \
            | jq -r '.tag_name')
          PINNED=$(cat VSCODIUM_TAG)
          echo "Latest upstream: $LATEST   Pinned: $PINNED"
          if [ "$LATEST" = "$PINNED" ]; then
            echo "Already up to date."
            exit 0
          fi
          echo "$LATEST" > VSCODIUM_TAG
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="update/vscodium-${LATEST}"
          git checkout -b "$BRANCH"
          git add VSCODIUM_TAG
          git commit -m "chore: bump VSCodium upstream to ${LATEST}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update VSCodium upstream to ${LATEST}" \
            --body "Automated upstream version bump. Verify patches apply cleanly before merging." \
            --head "$BRANCH" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build: patch → merge → build → package → upload ───────────────────────
  build-windows:
    name: Build Windows x64
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: ide-overlay

      - name: Resolve VSCodium tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.vscodium_tag }}'
          if (-not $tag) { $tag = (Get-Content ide-overlay/VSCODIUM_TAG -Raw).Trim() }
          "tag=$tag" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Warn if a newer VSCodium release is available
        shell: pwsh
        run: |
          $current = '${{ steps.tag.outputs.tag }}'
          $latest  = (Invoke-RestMethod 'https://api.github.com/repos/VSCodium/vscodium/releases/latest').tag_name
          Write-Host "Building against: $current   Latest upstream: $latest"
          if ($current -ne $latest) {
            Write-Host "::warning::Building against VSCodium $current but $latest is available. Update VSCODIUM_TAG to get the latest."
          }

      - name: Clone VSCodium at pinned tag
        run: git clone https://github.com/VSCodium/vscodium --depth=1 --branch ${{ steps.tag.outputs.tag }} vscodium-src

      - name: Read matching VS Code (MS) tag
        id: ms-tag
        shell: pwsh
        run: |
          $msTag = (Get-Content vscodium-src/upstream/stable.json -Raw | ConvertFrom-Json).tag
          "ms_tag=$msTag" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Clone VS Code source at MS tag
        run: git clone https://github.com/microsoft/vscode --depth=1 --branch ${{ steps.ms-tag.outputs.ms_tag }} vscode-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'vscode-src/.nvmrc'
          cache: 'npm'
          cache-dependency-path: vscode-src/package-lock.json

      - name: Restore VS Code node_modules cache
        id: vscode-node-modules-cache
        uses: actions/cache@v4
        with:
          path: vscode-src/node_modules
          key: ${{ runner.os }}-vscode-node-modules-${{ steps.ms-tag.outputs.ms_tag }}-${{ hashFiles('vscode-src/package-lock.json') }}

      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Apply VSCodium patches
        shell: pwsh
        working-directory: vscode-src
        run: |
          foreach ($dir in @('../vscodium-src/patches', '../vscodium-src/patches/windows')) {
            Get-ChildItem $dir -Filter *.patch -ErrorAction SilentlyContinue |
              Sort-Object Name |
              ForEach-Object {
                Write-Host "Applying: $($_.Name)"
                git apply --ignore-whitespace $_.FullName
              }
          }

      - name: Apply overlay patches
        shell: pwsh
        working-directory: vscode-src
        run: |
          $patches = Get-ChildItem ../ide-overlay/patches -Filter *.patch -ErrorAction SilentlyContinue |
            Sort-Object Name
          foreach ($p in $patches) {
            Write-Host "Applying overlay patch: $($p.Name)"
            git apply --ignore-whitespace $p.FullName
          }

      - name: Merge product.json overlay
        shell: pwsh
        run: |
          node ide-overlay/scripts/merge-json.js `
            vscode-src/product.json `
            ide-overlay/product.json `
            vscode-src/product.json

      - name: Install null-markdown dependencies
        shell: pwsh
        run: npm ci --prefix ide-overlay/extensions/null-markdown

      - name: Compile null-tools TypeScript
        shell: pwsh
        run: |
          Set-Location ide-overlay/extensions/null-tools
          npm ci --ignore-scripts
          npm run compile

      - name: Copy built-in extensions
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force ide-overlay/extensions/null-theme    vscode-src/extensions/
          Copy-Item -Recurse -Force ide-overlay/extensions/null-tools    vscode-src/extensions/
          Copy-Item -Recurse -Force ide-overlay/extensions/null-icons    vscode-src/extensions/
          Copy-Item -Recurse -Force ide-overlay/extensions/null-markdown vscode-src/extensions/

      - name: Bundle Code Spell Checker as built-in extension
        shell: pwsh
        env:
          CSPELL_TAG: ${{ env.CSPELL_TAG }}
        run: |
          # Clone the repo at the pinned tag (satisfies source tracking)
          $tag = $env:CSPELL_TAG
          Write-Host "Bundling Code Spell Checker at tag: $tag"
          git clone --depth 1 --branch $tag `
            https://github.com/streetsidesoftware/vscode-spell-checker.git `
            cspell-src

          # Extract the semver version (e.g. 'code-spell-checker-v4.5.6' -> '4.5.6')
          $version = $tag -replace '^code-spell-checker-v', ''
          Write-Host "Semver version: $version"

          # Download published VSIX from VS Marketplace (saved as .zip for Expand-Archive)
          $vsixZip = "cspell.zip"
          $vsixUrl = "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/streetsidesoftware/vsextensions/code-spell-checker/$version/vspackage"
          Write-Host "Downloading Marketplace VSIX from: $vsixUrl"
          Invoke-WebRequest $vsixUrl -OutFile $vsixZip -UseBasicParsing

          # Unpack VSIX (extension contents live under 'extension/')
          Expand-Archive $vsixZip -DestinationPath cspell-unpacked -Force

          # Copy into vscode-src/extensions/
          $dest = 'vscode-src/extensions/code-spell-checker'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Move-Item cspell-unpacked/extension $dest

          # Sanitize package.json: strip workspaces, dependencies, devDependencies, and scripts.
          # The extension code is fully bundled into dist/ and node_modules; leaving monorepo
          # workspace dependencies in package.json causes VS Code's build (npm list --production) to fail.
          node -e "
            const fs = require('fs');
            const file = '$dest/package.json';
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            delete pkg.workspaces;
            delete pkg.dependencies;
            delete pkg.devDependencies;
            delete pkg.scripts;
            delete pkg.private;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
            console.log('Sanitized package.json for built-in extension packaging');
          "

          # Cleanup temporary files
          Remove-Item $vsixZip, cspell-unpacked, cspell-src -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Successfully bundled Code Spell Checker $version into $dest"



      - name: Replace icons
        shell: pwsh
        run: |
          $win32 = "vscode-src/resources/win32"
          # ICO — cover every name variant the gulp build or VSCodium patches might reference
          foreach ($name in @("code", "codium", "vscodium", "null")) {
            Copy-Item ide-overlay/icons/icon.ico "$win32/$name.ico" -Force
            Write-Host "Replaced $win32/$name.ico"
          }
          # PNG — Electron BrowserWindow reads these for the window/alt-tab icon on Windows
          Copy-Item ide-overlay/icons/icon_150x150.png "$win32/code_150x150.png" -Force
          Copy-Item ide-overlay/icons/icon_70x70.png   "$win32/code_70x70.png"   -Force
          Write-Host "Replaced win32 PNG icons"
          # SVG — custom title bar renders this via CSS background-image
          Copy-Item ide-overlay/icons/icon.svg `
            vscode-src/src/vs/workbench/browser/media/code-icon.svg -Force
          Write-Host "Replaced code-icon.svg (title bar)"

      - name: Copy workbench assets into source tree
        shell: pwsh
        run: |
          # Both files land alongside workbench.html so gulp includes them in the artifact.
          $wb = "vscode-src/src/vs/code/electron-browser/workbench"
          Copy-Item ide-overlay/workbench/custom.css  "$wb/null-custom.css"  -Force
          Copy-Item ide-overlay/workbench/splash.js   "$wb/null-splash.js"   -Force

      - name: Inject custom assets into workbench.html
        shell: pwsh
        run: |
          $file = "vscode-src/src/vs/code/electron-browser/workbench/workbench.html"
          $html = Get-Content $file -Raw
          $anchor = '<link rel="stylesheet" href="../../../workbench/workbench.desktop.main.css">'
          if (-not $html.Contains($anchor)) {
            Write-Error "Anchor line not found in workbench.html — check the path after a VS Code version bump"
            exit 1
          }
          $inject = $anchor + "`n`t`t<link rel=`"stylesheet`" href=`"null-custom.css`">`n`t`t<script src=`"null-splash.js`"></script>"
          $html = $html.Replace($anchor, $inject)
          [System.IO.File]::WriteAllText($file, $html, [System.Text.UTF8Encoding]::new($false))

      - name: Install dependencies
        if: steps.vscode-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: vscode-src
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Verify dependencies
        shell: pwsh
        working-directory: vscode-src
        run: |
          if (-not (Test-Path node_modules)) {
            Write-Error "node_modules missing after dependency restore/install"
            exit 1
          }

      - name: Install @anthropic-ai/sdk (required by VS Code agentHost source)
        working-directory: vscode-src
        # Pin to 0.82.0 — the version VS Code 1.121 was designed for. @anthropic-ai/claude-agent-sdk
        # (still installed) bundles @anthropic-ai/sdk@^0.81.0 nested inside itself; pinning to 0.82.0
        # satisfies that range so npm deduplicates both to a single copy and avoids type conflicts.
        run: npm install @anthropic-ai/sdk@0.82.0 --no-save --no-audit --fund=false

      - name: Remove agentHost files that import @github/copilot-sdk
        # VSCodium's 52-ext-copilot-remove-it patch strips @github/copilot-sdk from package.json
        # but leaves source files that import it. Scan the whole agentHost tree and delete any .ts
        # file that references the removed package. Some copilot/ files (pendingEditContentStore,
        # copilotGitProject) have no SDK import and must be kept because production code still
        # references them. Deleting only the SDK-importing files avoids cascade "cannot find module"
        # errors in files that reference the kept ones.
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "vscode-src/src/vs/platform/agentHost/test" -ErrorAction SilentlyContinue
          $deletedBaseNames = @()
          Get-ChildItem "vscode-src/src/vs/platform/agentHost" -Recurse -Filter "*.ts" |
            Where-Object { (Get-Content $_.FullName -Raw) -match "'@github/copilot-sdk'" } |
            ForEach-Object {
              $deletedBaseNames += $_.BaseName
              Remove-Item $_.FullName -Force
              Write-Host "Deleted (has @github/copilot-sdk import): $($_.Name)"
            }
          # Some surviving files register the deleted modules via side-effect imports
          # (e.g. allPrompts.ts's `import './anthropicPrompt.js';`). Strip those dangling
          # references too, or the hub file fails with "cannot find module".
          foreach ($baseName in $deletedBaseNames) {
            Get-ChildItem "vscode-src/src/vs/platform/agentHost" -Recurse -Filter "*.ts" |
              ForEach-Object {
                $content = Get-Content $_.FullName -Raw
                $pattern = "(?m)^\s*import\s+'\./$([regex]::Escape($baseName))\.js';\s*\r?\n"
                if ($content -match $pattern) {
                  $updated = $content -replace $pattern, ''
                  [System.IO.File]::WriteAllText($_.FullName, $updated, [System.Text.UTF8Encoding]::new($false))
                  Write-Host "Removed dangling side-effect import of $baseName.js from $($_.Name)"
                }
              }
          }
          $f = "vscode-src/src/vs/platform/agentHost/node/agentHostServerMain.ts"
          if (Test-Path $f) {
            $c = [System.IO.File]::ReadAllText($f)
            $c = $c -replace '(?s)\n\tif \(options\.enableMockAgent\) \{.+?\n\t\}', ''
            [System.IO.File]::WriteAllText($f, $c, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Removed enableMockAgent block from agentHostServerMain.ts"
          }

      - name: Build
        working-directory: vscode-src
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_QUALITY: stable
        run: npx gulp vscode-win32-x64

      - name: Fetch VSCodium server commit hash
        id: vscodium-commit
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $url = "https://github.com/VSCodium/vscodium/releases/download/$tag/vscodium-reh-linux-x64-$tag.tar.gz"
          Write-Host "Downloading server tarball to extract commit hash..."
          Invoke-WebRequest $url -OutFile vscodium-reh.tar.gz -UseBasicParsing
          New-Item -ItemType Directory -Path server-extract -Force | Out-Null
          tar -xzf vscodium-reh.tar.gz -C server-extract product.json
          $commit = (Get-Content server-extract/product.json -Raw | ConvertFrom-Json).commit
          Write-Host "VSCodium server commit: $commit"
          "commit=$commit" | Out-File -Append $env:GITHUB_OUTPUT
          Remove-Item vscodium-reh.tar.gz -Force
          Remove-Item server-extract -Recurse -Force

      - name: Stamp version and server URL into build output product.json
        shell: pwsh
        run: |
          $productPath = "VSCode-win32-x64/resources/app/product.json"
          $p = [System.IO.File]::ReadAllText($productPath) | ConvertFrom-Json
          $vscodiumTag = '${{ steps.tag.outputs.tag }}'
          $commit      = '${{ steps.vscodium-commit.outputs.commit }}'
          $p.version   = $vscodiumTag
          $p.commit    = $commit
          $p | Add-Member -MemberType NoteProperty -Name "release" -Value $vscodiumTag -Force
          $p.serverDownloadUrlTemplate           = "https://github.com/VSCodium/vscodium/releases/download/`${release}/vscodium-reh-`${os}-`${arch}-`${release}.tar.gz"
          $p.webviewContentExternalBaseUrlTemplate = "https://{{uuid}}.vscode-cdn.net/stable/$commit/out/vs/workbench/contrib/webview/browser/pre/"
          # Fix double-brace template artifacts left by VSCodium source product.json
          $p.win32x64UserAppId   = $p.win32x64UserAppId   -replace '^\{\{', '{'
          $p.win32arm64AppId     = $p.win32arm64AppId     -replace '^\{\{', '{'
          $p.win32arm64UserAppId = $p.win32arm64UserAppId -replace '^\{\{', '{'
          $json = $p | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText($productPath, $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Stamped version=$vscodiumTag, release=$vscodiumTag, commit=$commit"

      - name: Fix icons and VisualElementsManifest in build output
        shell: pwsh
        run: |
          $outWin32 = "VSCode-win32-x64/resources/app/resources/win32"
          # Ensure our icons are in the output (gulp may not have picked them all up)
          foreach ($name in @("null", "code", "codium", "vscodium")) {
            Copy-Item ide-overlay/icons/icon.ico "$outWin32/$name.ico" -Force
          }
          Copy-Item ide-overlay/icons/icon_150x150.png "$outWin32/code_150x150.png" -Force
          Copy-Item ide-overlay/icons/icon_70x70.png   "$outWin32/code_70x70.png"   -Force
          # Replace the gulp-generated manifest (ShortDisplayName, BackgroundColor)
          Copy-Item ide-overlay/installer/Null.VisualElementsManifest.xml `
            VSCode-win32-x64/Null.VisualElementsManifest.xml -Force
          # Replace letterpress (empty-editor watermark) SVGs with our null symbol
          $outMedia = "VSCode-win32-x64/resources/app/out/media"
          foreach ($variant in @("letterpress-dark", "letterpress-hcDark")) {
            Copy-Item ide-overlay/workbench/letterpress-dark.svg  "$outMedia/$variant.svg" -Force
          }
          foreach ($variant in @("letterpress-light", "letterpress-hcLight")) {
            Copy-Item ide-overlay/workbench/letterpress-light.svg "$outMedia/$variant.svg" -Force
          }
          Write-Host "Fixed win32 icons, VisualElementsManifest, and letterpress SVGs"

      - name: Copy file-association icons into build output
        shell: pwsh
        run: |
          $destDir = "VSCode-win32-x64/resources/file-assoc-icons"
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          Copy-Item ide-overlay/icons/file-assoc/*.ico $destDir -Force
          $count = (Get-ChildItem $destDir -Filter *.ico).Count
          Write-Host "Copied $count file-association icons to $destDir"

      - name: Copy workbench overlay files into build output
        shell: pwsh
        run: |
          $outWb = "VSCode-win32-x64/resources/app/out/vs/code/electron-browser/workbench"
          if (-not (Test-Path $outWb)) {
            Write-Error "Build output workbench directory not found: $outWb"
            exit 1
          }
          Copy-Item ide-overlay/workbench/custom.css "$outWb/null-custom.css" -Force
          Copy-Item ide-overlay/workbench/splash.js  "$outWb/null-splash.js"  -Force
          Write-Host "Copied null-custom.css and null-splash.js into build output"

      - name: Bundle node-pty into null-tools output
        shell: pwsh
        run: |
          # Copy node-pty into the output directory AFTER the gulp build to bypass VS Code's native module checks.
          $src  = "vscode-src/node_modules/node-pty"
          $dest = "VSCode-win32-x64/resources/app/extensions/null-tools/node_modules/node-pty"
          if (-not (Test-Path $src)) {
            Write-Error "node-pty not found in vscode-src/node_modules — check npm ci output"
            exit 1
          }
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Copy-Item $src $dest -Recurse -Force
          Write-Host "Bundled node-pty into build output ($((Get-ChildItem $dest/build/Release -Filter *.node).Count) native addon(s))"

      - name: Stamp icon into executable
        shell: pwsh
        run: |
          $outDir = "VSCode-win32-x64"
          $exe = Get-ChildItem $outDir -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Warning "No .exe found in $outDir — skipping"; exit 0 }
          npm install rcedit --prefix ./rcedit-tool --silent
          $rcedit = ".\rcedit-tool\node_modules\rcedit\bin\rcedit.exe"
          & $rcedit $exe.FullName --set-icon ide-overlay/icons/icon.ico
          Write-Host "Stamped icon onto $($exe.Name)"
          # product.json applicationName is "null"; ensure the on-disk binary matches AppxManifest.xml
          $nullExe = Join-Path $outDir "null.exe"
          if ($exe.Name -ne "null.exe") {
            if (Test-Path $nullExe) { Remove-Item $nullExe -Force }
            Rename-Item $exe.FullName $nullExe
            Write-Host "Renamed $($exe.Name) -> null.exe"
          }

      - name: Build Win11 shell extension
        shell: powershell
        run: |
          $outDir    = "VSCode-win32-x64"
          $shellSrc  = "ide-overlay/shell-ext"
          $dllDest   = "$outDir/shell-ext/NullIDE.ExplorerCommand/x64"
          $assetDest = "$outDir/shell-ext/Assets"
          $pkgDir    = "$outDir/shell-ext"

          # ── 1. Fetch wil (header-only) ──────────────────────────────────────
          if (-not (Test-Path "$shellSrc/deps/wil")) {
            Write-Host "Fetching microsoft/wil headers..."
            Invoke-WebRequest "https://github.com/microsoft/wil/archive/refs/heads/master.zip" `
              -OutFile wil.zip
            Expand-Archive wil.zip "$shellSrc/deps" -Force
            Rename-Item "$shellSrc/deps/wil-master" "wil"
            Remove-Item wil.zip
          }

          # ── 2. Build DLL with CMake + MSVC ──────────────────────────────────
          New-Item -ItemType Directory -Path $dllDest -Force | Out-Null
          cmake -S $shellSrc -B shell-ext-build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build shell-ext-build --config Release
          Copy-Item "shell-ext-build/Release/null_explorer_command.dll" $dllDest -Force
          Write-Host "DLL built: $(Get-Item "$dllDest/null_explorer_command.dll" | Select-Object -Expand Length) bytes"

          # ── 3. Prepare icon assets ───────────────────────────────────────────
          New-Item -ItemType Directory -Path $assetDest -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          function Resize-Png($src, $dst, $w, $h) {
            $img = [System.Drawing.Image]::FromFile((Resolve-Path $src))
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($img, 0, 0, $w, $h)
            $bmp.Save($dst, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose(); $img.Dispose()
          }
          $icon1024 = "ide-overlay/icons/icon.png"
          Resize-Png $icon1024 "$assetDest/Square150x150Logo.png" 150 150
          Resize-Png $icon1024 "$assetDest/Square44x44Logo.png"   44  44
          Resize-Png $icon1024 "$assetDest/StoreLogo.png"         50  50

          # ── 4. Copy manifest into package staging dir ────────────────────────
          Copy-Item "$shellSrc/AppxManifest.xml" $pkgDir -Force

          # ── 5. Generate self-signed cert (CN must match manifest Publisher) ──
          $cert = New-SelfSignedCertificate `
            -Subject "CN=Null IDE" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Type CodeSigning `
            -KeySpec Signature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10)
          Export-Certificate -Cert $cert -FilePath "$pkgDir/NullIDECert.cer" | Out-Null
          $pfxPwd = ConvertTo-SecureString -String "nullbuild" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath NullIDECert.pfx -Password $pfxPwd | Out-Null
          Write-Host "Signing cert thumbprint: $($cert.Thumbprint)"

          # ── 6. Pack sparse .appx ─────────────────────────────────────────────
          $makeappx = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { Write-Error "makeappx.exe not found"; exit 1 }

          # Stage only the files the .appx itself contains (manifest + assets)
          $appxStage = "appx-stage"
          New-Item -ItemType Directory -Path $appxStage -Force | Out-Null
          Copy-Item "$pkgDir/AppxManifest.xml" $appxStage
          New-Item -ItemType Directory -Path "$appxStage/Assets" -Force | Out-Null
          Copy-Item "$assetDest/*" "$appxStage/Assets/"
          & $makeappx pack /d $appxStage /p "$pkgDir/null-shell-ext.appx" /nv /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makeappx pack failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          Remove-Item $appxStage -Recurse -Force
          if (-not (Test-Path "$pkgDir/null-shell-ext.appx")) {
            Write-Error "makeappx did not produce null-shell-ext.appx"
            exit 1
          }

          # ── 7. Sign .appx ────────────────────────────────────────────────────
          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          & $signtool sign /fd SHA256 /f NullIDECert.pfx /p nullbuild "$pkgDir/null-shell-ext.appx"
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          Remove-Item NullIDECert.pfx -Force
          # Self-signed appx certs are not in the build agent trust store; verify thumbprint instead of Status=Valid.
          $sig = Get-AuthenticodeSignature "$pkgDir/null-shell-ext.appx"
          if (-not $sig.SignerCertificate) {
            Write-Error "Shell extension .appx is not signed."
            exit 1
          }
          if ($sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            Write-Error "Shell extension .appx signed with unexpected certificate."
            exit 1
          }
          Write-Host "Shell extension package built and signed (thumbprint: $($cert.Thumbprint))."

          # ── Final layout under VSCode-win32-x64/shell-ext/ ──────────────────
          Write-Host "Shell-ext layout:"
          Get-ChildItem $pkgDir -Recurse | Select-Object FullName

      - name: Prepare installer and updater payload
        shell: pwsh
        run: |
          $outDir = "VSCode-win32-x64"
          $version = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') {
            $version = '${{ steps.tag.outputs.tag }}'
          }

          $updaterDir = Join-Path $outDir "resources/app/null-updater"
          New-Item -ItemType Directory -Path $updaterDir -Force | Out-Null
          Copy-Item ide-overlay/scripts/install-null-ide.ps1 $updaterDir -Force
          Copy-Item ide-overlay/scripts/update-null-ide.ps1  $updaterDir -Force

          $metadata = [ordered]@{
            repo        = '${{ github.repository }}'
            version     = $version
            installedAt = $null
            installDir  = $null
          }
          $metadata | ConvertTo-Json | Set-Content (Join-Path $outDir ".null-ide-install.json") -Encoding UTF8
          Write-Host "Prepared update metadata for $version"

      - name: Create zip archive
        shell: pwsh
        run: |
          Write-Host "Contents of workspace root:"
          Get-ChildItem -Directory | Select-Object -ExpandProperty Name
          $outDir = "VSCode-win32-x64"
          if (-not (Test-Path $outDir)) {
            Write-Error "Build output directory '$outDir' not found"
            exit 1
          }
          Compress-Archive -Path "$outDir\*" -DestinationPath null-ide-win32-x64.zip -Force
          Write-Host "Archive created: $((Get-Item null-ide-win32-x64.zip).Length / 1MB) MB"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') {
            $version = '${{ steps.tag.outputs.tag }}'
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $sourceDir = (Resolve-Path VSCode-win32-x64).Path
          & $iscc ide-overlay/installer/null-ide.iss /DSourceDir="$sourceDir" /DAppVersion="$version" /O"$PWD"

          $expected = Join-Path $PWD "NullIDESetup-$version.exe"
          $installer = Get-ChildItem -Path . -Recurse -Filter "NullIDESetup*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Inno Setup completed, but no NullIDESetup*.exe was found."
            exit 1
          }

          if ($installer.FullName -ne $expected) {
            Copy-Item $installer.FullName $expected -Force
          }

          if (-not (Test-Path $expected)) {
            Write-Error "Expected installer was not created at $expected"
            exit 1
          }

          Write-Host "Installer created: $expected"

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            null-ide-win32-x64.zip
            NullIDESetup-*.exe
            ide-overlay/scripts/install-null-ide.ps1
          fail_on_unmatched_files: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: null-ide-win32-x64-${{ steps.tag.outputs.tag }}
          path: |
            null-ide-win32-x64.zip
            NullIDESetup-*.exe
            ide-overlay/scripts/install-null-ide.ps1
          if-no-files-found: error
          retention-days: 30
