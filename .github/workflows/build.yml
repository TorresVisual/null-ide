name: Build Null IDE

on:
  workflow_dispatch:
    inputs:
      vscodium_tag:
        description: 'VSCodium tag to build against (overrides pinned VSCODIUM_TAG)'
        required: false
        default: ''
  push:
    tags: ['v*']
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC — upstream check only

concurrency:
  group: null-ide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VSCODIUM_TAG: '1.116.02821'  # Pin; bumped automatically by upstream-check job
  APP_NAME: null
  APP_NAME_LONG: Null IDE

jobs:
  # ── Scheduled: open a PR when VSCodium releases a new version ──────────────
  upstream-check:
    name: Check for new VSCodium release
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Compare latest VSCodium tag to pinned tag
        run: |
          LATEST=$(curl -fsSL https://api.github.com/repos/VSCodium/vscodium/releases/latest \
            | jq -r '.tag_name')
          PINNED="${{ env.VSCODIUM_TAG }}"
          echo "Latest upstream: $LATEST   Pinned: $PINNED"
          if [ "$LATEST" = "$PINNED" ]; then
            echo "Already up to date."
            exit 0
          fi
          # Bump the pinned tag in this file and open a PR
          sed -i "s/VSCODIUM_TAG: '${PINNED}'/VSCODIUM_TAG: '${LATEST}'/" \
            .github/workflows/build.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="update/vscodium-${LATEST}"
          git checkout -b "$BRANCH"
          git add .github/workflows/build.yml
          git commit -m "chore: bump VSCodium upstream to ${LATEST}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update VSCodium upstream to ${LATEST}" \
            --body "Automated upstream version bump. Verify patches apply cleanly before merging." \
            --head "$BRANCH" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build: patch → merge → build → package → upload ───────────────────────
  build-windows:
    name: Build Windows x64
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: ide-overlay

      - name: Resolve VSCodium tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.vscodium_tag }}'
          if (-not $tag) { $tag = '${{ env.VSCODIUM_TAG }}' }
          "tag=$tag" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Clone VSCodium at pinned tag
        run: git clone https://github.com/VSCodium/vscodium --depth=1 --branch ${{ steps.tag.outputs.tag }} vscodium-src

      - name: Read matching VS Code (MS) tag
        id: ms-tag
        shell: pwsh
        run: |
          $msTag = (Get-Content vscodium-src/upstream/stable.json -Raw | ConvertFrom-Json).tag
          "ms_tag=$msTag" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Clone VS Code source at MS tag
        run: git clone https://github.com/microsoft/vscode --depth=1 --branch ${{ steps.ms-tag.outputs.ms_tag }} vscode-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'npm'
          cache-dependency-path: vscode-src/package-lock.json

      - name: Restore VS Code node_modules cache
        id: vscode-node-modules-cache
        uses: actions/cache@v4
        with:
          path: vscode-src/node_modules
          key: ${{ runner.os }}-vscode-node-modules-${{ steps.ms-tag.outputs.ms_tag }}-${{ hashFiles('vscode-src/package-lock.json') }}

      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Apply VSCodium patches
        shell: pwsh
        working-directory: vscode-src
        run: |
          foreach ($dir in @('../vscodium-src/patches', '../vscodium-src/patches/windows')) {
            Get-ChildItem $dir -Filter *.patch -ErrorAction SilentlyContinue |
              Sort-Object Name |
              ForEach-Object {
                Write-Host "Applying: $($_.Name)"
                git apply --ignore-whitespace $_.FullName
              }
          }

      - name: Apply overlay patches
        shell: pwsh
        working-directory: vscode-src
        run: |
          $patches = Get-ChildItem ../ide-overlay/patches -Filter *.patch -ErrorAction SilentlyContinue |
            Sort-Object Name
          foreach ($p in $patches) {
            Write-Host "Applying overlay patch: $($p.Name)"
            git apply --ignore-whitespace $p.FullName
          }

      - name: Merge product.json overlay
        shell: pwsh
        run: |
          node ide-overlay/scripts/merge-json.js `
            vscode-src/product.json `
            ide-overlay/product.json `
            vscode-src/product.json

      - name: Copy built-in extensions
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force ide-overlay/extensions/null-theme vscode-src/extensions/
          Copy-Item -Recurse -Force ide-overlay/extensions/null-tools  vscode-src/extensions/

      - name: Bundle node-pty into null-tools
        shell: pwsh
        run: |
          # vscode-src/node_modules/node-pty is already built for the correct Electron version
          # by the upstream npm ci step. Copy it into the extension so it ships as a built-in.
          $src  = "vscode-src/node_modules/node-pty"
          $dest = "vscode-src/extensions/null-tools/node_modules/node-pty"
          if (-not (Test-Path $src)) {
            Write-Error "node-pty not found in vscode-src/node_modules — check npm ci output"
            exit 1
          }
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Copy-Item $src $dest -Recurse -Force
          Write-Host "Bundled node-pty into null-tools ($((Get-ChildItem $dest/build/Release -Filter *.node).Count) native addon(s))"

      - name: Replace icons
        shell: pwsh
        run: |
          $win32 = "vscode-src/resources/win32"
          # ICO — cover every name variant the gulp build or VSCodium patches might reference
          foreach ($name in @("code", "codium", "vscodium", "null")) {
            Copy-Item ide-overlay/icons/icon.ico "$win32/$name.ico" -Force
            Write-Host "Replaced $win32/$name.ico"
          }
          # PNG — Electron BrowserWindow reads these for the window/alt-tab icon on Windows
          Copy-Item ide-overlay/icons/icon_150x150.png "$win32/code_150x150.png" -Force
          Copy-Item ide-overlay/icons/icon_70x70.png   "$win32/code_70x70.png"   -Force
          Write-Host "Replaced win32 PNG icons"
          # SVG — custom title bar renders this via CSS background-image
          Copy-Item ide-overlay/icons/icon.svg `
            vscode-src/src/vs/workbench/browser/media/code-icon.svg -Force
          Write-Host "Replaced code-icon.svg (title bar)"

      - name: Copy workbench assets into source tree
        shell: pwsh
        run: |
          # Both files land alongside workbench.html so gulp includes them in the artifact.
          $wb = "vscode-src/src/vs/code/electron-browser/workbench"
          Copy-Item ide-overlay/workbench/custom.css  "$wb/null-custom.css"  -Force
          Copy-Item ide-overlay/workbench/splash.js   "$wb/null-splash.js"   -Force

      - name: Inject custom assets into workbench.html
        shell: pwsh
        run: |
          $file = "vscode-src/src/vs/code/electron-browser/workbench/workbench.html"
          $html = Get-Content $file -Raw
          $anchor = '<link rel="stylesheet" href="../../../workbench/workbench.desktop.main.css">'
          if (-not $html.Contains($anchor)) {
            Write-Error "Anchor line not found in workbench.html — check the path after a VS Code version bump"
            exit 1
          }
          $inject = $anchor + "`n`t`t<link rel=`"stylesheet`" href=`"null-custom.css`">`n`t`t<script src=`"null-splash.js`"></script>"
          $html = $html.Replace($anchor, $inject)
          [System.IO.File]::WriteAllText($file, $html, [System.Text.UTF8Encoding]::new($false))

      - name: Install dependencies
        if: steps.vscode-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: vscode-src
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Verify dependencies
        shell: pwsh
        working-directory: vscode-src
        run: |
          if (-not (Test-Path node_modules)) {
            Write-Error "node_modules missing after dependency restore/install"
            exit 1
          }

      - name: Build
        working-directory: vscode-src
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VSCODE_QUALITY: stable
        run: npx gulp vscode-win32-x64

      - name: Stamp icon into executable
        shell: pwsh
        run: |
          $outDir = "VSCode-win32-x64"
          $exe = Get-ChildItem $outDir -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Warning "No .exe found in $outDir — skipping"; exit 0 }
          npm install rcedit --prefix ./rcedit-tool --silent
          $rcedit = ".\rcedit-tool\node_modules\rcedit\bin\rcedit.exe"
          & $rcedit $exe.FullName --set-icon ide-overlay/icons/icon.ico
          Write-Host "Stamped icon onto $($exe.Name)"

      - name: Prepare installer and updater payload
        shell: pwsh
        run: |
          $outDir = "VSCode-win32-x64"
          $version = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') {
            $version = '${{ steps.tag.outputs.tag }}'
          }

          $updaterDir = Join-Path $outDir "resources/app/null-updater"
          New-Item -ItemType Directory -Path $updaterDir -Force | Out-Null
          Copy-Item ide-overlay/scripts/install-null-ide.ps1 $updaterDir -Force
          Copy-Item ide-overlay/scripts/update-null-ide.ps1  $updaterDir -Force

          $metadata = [ordered]@{
            repo        = '${{ github.repository }}'
            version     = $version
            installedAt = $null
            installDir  = $null
          }
          $metadata | ConvertTo-Json | Set-Content (Join-Path $outDir ".null-ide-install.json") -Encoding UTF8
          Write-Host "Prepared update metadata for $version"

      - name: Create zip archive
        shell: pwsh
        run: |
          Write-Host "Contents of workspace root:"
          Get-ChildItem -Directory | Select-Object -ExpandProperty Name
          $outDir = "VSCode-win32-x64"
          if (-not (Test-Path $outDir)) {
            Write-Error "Build output directory '$outDir' not found"
            exit 1
          }
          Compress-Archive -Path "$outDir\*" -DestinationPath null-ide-win32-x64.zip -Force
          Write-Host "Archive created: $((Get-Item null-ide-win32-x64.zip).Length / 1MB) MB"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') {
            $version = '${{ steps.tag.outputs.tag }}'
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $sourceDir = (Resolve-Path VSCode-win32-x64).Path
          & $iscc ide-overlay/installer/null-ide.iss /DSourceDir="$sourceDir" /DAppVersion="$version" /O"$PWD"

          $expected = Join-Path $PWD "NullIDESetup-$version.exe"
          $installer = Get-ChildItem -Path . -Recurse -Filter "NullIDESetup*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Inno Setup completed, but no NullIDESetup*.exe was found."
            exit 1
          }

          if ($installer.FullName -ne $expected) {
            Copy-Item $installer.FullName $expected -Force
          }

          if (-not (Test-Path $expected)) {
            Write-Error "Expected installer was not created at $expected"
            exit 1
          }

          Write-Host "Installer created: $expected"

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            null-ide-win32-x64.zip
            NullIDESetup-*.exe
          fail_on_unmatched_files: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: null-ide-win32-x64-${{ steps.tag.outputs.tag }}
          path: |
            null-ide-win32-x64.zip
            NullIDESetup-*.exe
          if-no-files-found: error
          retention-days: 30
