name: Actions Playground
on:
  workflow_dispatch:
    inputs:
      who:
        description: Who to greet
        required: true
        default: world
        type: string
      flavor:
        description: Pick one
        type: choice
        options: [vanilla, chocolate]
        default: vanilla
      fail:
        description: Fail the last step
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Greet
        run: echo "hello ${{ inputs.who }} (${{ inputs.flavor }})"
      - name: Slow output
        run: |
          echo "::group::Counting"
          for i in 1 2 3 4 5 6; do echo "tick $i"; sleep 5; done
          echo "::endgroup::"
      - name: Warn and error
        run: |
          echo "::warning file=src/a.ts,line=3,col=4::Something odd"
          echo "src/a.ts(3,4): error TS2304: Cannot find name 'x'."
      - name: Maybe fail
        if: ${{ inputs.fail }}
        run: |
          echo "::error::Told to fail"
          exit 1
  second:
    runs-on: ubuntu-latest
    steps:
      - run: echo "second job"
