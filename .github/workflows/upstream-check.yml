name: Check VSCodium upstream

# Opens a bump PR when VSCodium releases a new version. Dispatch it manually to
# test (run it from a branch whose VSCODIUM_TAG is older than the latest release).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC

# Needs repo setting: Actions → General → "Allow GitHub Actions to create and approve pull requests"
jobs:
  upstream-check:
    name: Check for new VSCodium release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Compare latest VSCodium tag to pinned tag
        run: |
          LATEST=$(gh api repos/VSCodium/vscodium/releases/latest --jq .tag_name)
          PINNED=$(cat VSCODIUM_TAG)
          echo "Latest upstream: $LATEST   Pinned: $PINNED"
          if [ "$LATEST" = "$PINNED" ]; then
            echo "Already up to date."
            exit 0
          fi
          BRANCH="update/vscodium-${LATEST}"
          # Any PR for this bump (open, merged, or closed on purpose) means: leave it alone.
          # A bare branch with no PR is a leftover from a failed run — reuse it.
          if [ "$(gh pr list --head "$BRANCH" --state all --json number --jq length)" != "0" ]; then
            echo "A PR for $BRANCH already exists."
            exit 0
          fi

          # Dry-run the patch stack (VSCodium's, then ours) against the new upstream,
          # in the same order build.yml applies them.
          W="$RUNNER_TEMP/patchcheck"
          git clone -q --depth=1 --branch "$LATEST" https://github.com/VSCodium/vscodium "$W/vscodium"
          MS_TAG=$(jq -r .tag "$W/vscodium/upstream/stable.json")
          git clone -q --depth=1 --branch "$MS_TAG" https://github.com/microsoft/vscode "$W/vscode"
          FAILED=""
          for p in "$W"/vscodium/patches/*.patch "$W"/vscodium/patches/windows/*.patch "$GITHUB_WORKSPACE"/patches/*.patch; do
            [ -e "$p" ] || continue
            git -C "$W/vscode" apply --ignore-whitespace "$p" 2>/dev/null || FAILED="$FAILED $(basename "$p")"
          done
          if [ -n "$FAILED" ]; then
            RESULT="⚠️ Patches that fail to apply against VS Code ${MS_TAG}:${FAILED}. A failure in a VSCodium patch can cascade into later ones; fix the earliest first."
            DRAFT="--draft"
          else
            RESULT="✅ All VSCodium and overlay patches apply cleanly against VS Code ${MS_TAG}."
            DRAFT=""
          fi

          echo "$LATEST" > VSCODIUM_TAG
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VSCODIUM_TAG
          git commit -m "chore: bump VSCodium upstream to ${LATEST}"
          git push --force origin "$BRANCH"  # bot-owned branch; overwrites a leftover from a failed run
          gh pr create $DRAFT \
            --title "Update VSCodium upstream to ${LATEST}" \
            --body "Automated upstream version bump (${PINNED} → ${LATEST}). ${RESULT} Before merging, reconcile docs/vscode-tracking.md rows up to VS Code ${MS_TAG} (/vscode-watch)." \
            --head "$BRANCH" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # VSCodium trails VS Code by several releases; review VS Code's own release notes
  # as they ship so features can be backported or adapted early (#115).
  vscode-releases:
    name: Open review issues for new VS Code releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Open one review issue per unreviewed VS Code release
        run: |
          LATEST=$(gh api repos/microsoft/vscode/releases/latest --jq .tag_name | cut -d. -f2)
          LAST=$(grep -oP 'Last reviewed: 1\.\K[0-9]+' docs/vscode-tracking.md)
          echo "Latest VS Code: 1.$LATEST   Last reviewed: 1.$LAST"
          for ((m = LAST + 1; m <= LATEST; m++)); do
            TITLE="Review VS Code 1.$m release notes"
            # Any issue with this exact title, open or closed, means it's handled.
            if [ "$(gh issue list --state all --search "$TITLE in:title" --json title \
                     --jq "map(select(.title == \"$TITLE\")) | length")" != "0" ]; then
              echo "Issue for 1.$m already exists."
              continue
            fi
            gh issue create --title "$TITLE" --body "VS Code 1.$m is out: https://code.visualstudio.com/updates/v1_$m

          Run /vscode-watch to triage its features for Null IDE (Backport / Adapt / Wait / N/A), file issues for the ones to build now, and record them in [docs/vscode-tracking.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/vscode-tracking.md).

          Part of #115."
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
